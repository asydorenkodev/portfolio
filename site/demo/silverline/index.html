<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Silverline Coffee | Victoria Square, Belfast</title>
  <meta name="description" content="Iced coffee on Victoria Square, Belfast. Four winter cups: Glacier, Crumble, Nutcracker and Kirsch.">
  <meta name="theme-color" content="#9fb4c8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,0..100&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/scene_back.webp">
  <link rel="preload" as="image" href="assets/img/glass.webp">
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23dfe8f0'/%3E%3Cellipse cx='20' cy='20' rx='9' ry='12.5' transform='rotate(28 20 20)' fill='none' stroke='%23233447' stroke-width='2.4'/%3E%3Cpath d='M14 31c4-5 2-10 6-14s7-6 7-9' fill='none' stroke='%23233447' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="is-loading">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- mark: a bean with one silver line running through it -->
  <symbol id="mark" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <ellipse cx="20" cy="20" rx="9.5" ry="13" transform="rotate(28 20 20)" stroke-width="2.2"/>
      <path d="M11.5 33.5c4.6-5.2 2.4-10.6 7-15.2S27 12 28.5 6.5" stroke-width="2"/>
    </g>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2.2"/><rect x="13" y="4" width="7" height="7" rx="2.2"/><rect x="4" y="13" width="7" height="7" rx="2.2"/><rect x="13" y="13" width="7" height="7" rx="2.2"/></g></symbol>
  <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.9" cy="7.2" r=".6" fill="currentColor"/></g></symbol>
  <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M14 4v10.4a3.4 3.4 0 1 1-3.4-3.4M14 4c.4 2.6 2.2 4.2 4.8 4.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3.5 9h17M12 9v11M12 9c-1.5-3.8-6-4.6-6-2.2C6 8.6 9.5 9 12 9zm0 0c1.5-3.8 6-4.6 6-2.2 0 1.8-3.5 2.2-6 2.2z"/></g></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/></g></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></g></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="cursor is-hidden" aria-hidden="true"><i class="cursor__ring"></i><i class="cursor__dot"></i></div>

<main class="app" id="app">

  <!-- the scene lives on a fixed 2496 x 1404 stage, scaled to cover the screen -->
  <div class="stage" id="stage" aria-hidden="false">
    <img class="st-back" src="assets/img/scene_back.webp" alt="" aria-hidden="true">
    <div class="halo" aria-hidden="true"><i></i><i></i></div>

    <div class="wheel" id="wheel" role="group" aria-label="Pick an ingredient">
      <button class="tile" data-i="0" aria-label="Clear ice: Glacier">
        <span class="tile__card"><span class="tile__frost"></span><span class="tile__sheen"></span>
          <img class="tile__img tile__img--ice" src="assets/img/ing_ice.webp" alt=""></span>
        <span class="tile__name">Clear ice</span>
      </button>
      <button class="tile" data-i="1" aria-label="Cookie: Crumble">
        <span class="tile__card"><span class="tile__frost"></span><span class="tile__sheen"></span>
          <img class="tile__img" src="assets/img/ing_cookie.webp" alt=""></span>
        <span class="tile__name">Cookie</span>
      </button>
      <button class="tile" data-i="2" aria-label="Peanut: Nutcracker">
        <span class="tile__card"><span class="tile__frost"></span><span class="tile__sheen"></span>
          <img class="tile__img" src="assets/img/ing_peanut.webp" alt=""></span>
        <span class="tile__name">Peanut</span>
      </button>
      <button class="tile" data-i="3" aria-label="Cherry: Kirsch">
        <span class="tile__card"><span class="tile__frost"></span><span class="tile__sheen"></span>
          <img class="tile__img" src="assets/img/ing_cherry.webp" alt=""></span>
        <span class="tile__name">Cherry</span>
      </button>
    </div>

    <div class="shadow" aria-hidden="true"></div>

    <figure class="cup" id="cup">
      <div class="cup__body" data-cup>
        <div class="cup__drinks">
          <img class="drink is-on" src="assets/img/drink1.webp" alt="Glacier: cold brew with caramel in a frosted glass">
          <img class="drink" src="assets/img/drink2.webp" alt="" aria-hidden="true">
          <img class="drink" src="assets/img/drink3.webp" alt="" aria-hidden="true">
          <img class="drink" src="assets/img/drink4.webp" alt="" aria-hidden="true">
        </div>
        <div class="cup__tops">
          <img class="top is-on" src="assets/img/top1.webp" alt="" aria-hidden="true">
          <img class="top" src="assets/img/top2.webp" alt="" aria-hidden="true">
          <img class="top" src="assets/img/top3.webp" alt="" aria-hidden="true">
          <img class="top" src="assets/img/top4.webp" alt="" aria-hidden="true">
        </div>
        <img class="cup__glass" src="assets/img/glass.webp" alt="" aria-hidden="true">
        <span class="cup__shine" aria-hidden="true"></span>
      </div>
      <figcaption class="cup__name" id="cupName" aria-live="polite">Glacier</figcaption>
    </figure>

    <div class="reflect" id="reflect" aria-hidden="true"></div>
    <img class="st-front" src="assets/img/scene_front.webp" alt="" aria-hidden="true">
    <div class="spill" aria-hidden="true"></div>

    <div class="price" id="price">
      <span class="price__label">Iced · 400 ml</span>
      <span class="price__num" id="priceNum">£4.60</span>
      <button class="price__add" id="addBtn" aria-label="Add Glacier to your order">
        <svg><use href="#i-bag"/></svg><span>Add</span>
      </button>
    </div>
  </div>

  <canvas class="snow" id="snow" aria-hidden="true"></canvas>

  <!-- top plates -->
  <header class="nav">
    <a class="logo" href="#" aria-label="Silverline Coffee, home">
      <svg class="logo__mark"><use href="#mark"/></svg>
      <span class="logo__type">silverline<i>Coffee · Belfast</i></span>
    </a>

    <nav class="dock glass" aria-label="Main">
      <a class="dock__btn" href="#menu" data-tip="Full menu"><svg><use href="#i-grid"/></svg></a>
      <a class="dock__btn" href="#instagram" data-tip="Instagram"><svg><use href="#i-insta"/></svg></a>
      <a class="dock__btn" href="#tiktok" data-tip="TikTok"><svg><use href="#i-tiktok"/></svg></a>
      <a class="dock__btn" href="#gift" data-tip="Gift cards"><svg><use href="#i-gift"/></svg></a>
      <a class="dock__btn dock__btn--bag" href="#order" data-tip="Your order"><svg><use href="#i-bag"/></svg><b class="dock__count" id="bagCount">0</b></a>
    </nav>

    <a class="where glass" href="#visit" aria-label="Victoria Square, Belfast. Open today until 19:00">
      <span class="where__icon"><svg><use href="#i-pin"/></svg></span>
      <span class="where__text"><b>Victoria Square, Belfast</b><span>Open today till 19:00</span></span>
    </a>
  </header>

  <h1 class="title" id="title" aria-label="Choose Your Coffee">Choose Your Coffee</h1>

  <div class="foot">
    <div class="foot__info">
      <span class="foot__count"><b id="countNow">01</b><i>/</i>04</span>
      <p class="foot__desc" id="desc">Cold brew over clear ice, salted caramel, a soft cold foam.</p>
    </div>
    <div class="foot__nav">
      <button class="arrow arrow--prev glass" id="prev" aria-label="Previous coffee"><svg><use href="#i-arrow"/></svg><svg><use href="#i-arrow"/></svg></button>
      <button class="arrow arrow--next glass" id="next" aria-label="Next coffee"><svg><use href="#i-arrow"/></svg><svg><use href="#i-arrow"/></svg></button>
    </div>
  </div>
</main>

<script src="js/main.js?v=8" defer></script>
</body>
</html>
